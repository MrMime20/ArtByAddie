name: Auto Compress Images

on:
  push:
    paths:
      - '**.webp' # Runs automatically when a .webp file is pushed
  workflow_dispatch: # <--- THIS adds a manual trigger button in GitHub!

jobs:
  compress:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sharp
        run: npm install sharp

      - name: Run Compress Script
        run: node compress-all.js

      - name: Commit optimized images back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-compress webp images [skip ci]"
